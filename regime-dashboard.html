<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>국면 판단 대시보드</title>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Pretendard');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: #eef0f4;
  }
  body {
    width: 1280px;
    margin: 0 auto;
    background: #ffffff;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', 'Malgun Gothic', sans-serif;
    color: #1B2A4A;
  }

  /* ---------- slide (16:9, 1280x720 고정 — PPT 캐처용) ---------- */
  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #ffffff;
    overflow: hidden;
  }

  /* ---------- watermark ---------- */
  #watermark {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #watermark .wm-row {
    display: flex;
    white-space: nowrap;
    transform: rotate(-28deg);
    position: absolute;
    left: -20%;
  }
  #watermark .wm-item {
    font-size: 20px;
    font-weight: 700;
    color: #1B2A4A;
    opacity: 0.05;
    margin-right: 60px;
    letter-spacing: 1px;
  }

  /* ---------- shell ---------- */
  #content {
    position: relative;
    z-index: 1;
    width: 1280px;
    height: 720px;
    padding: 26px 44px 20px 44px;
    display: flex;
    flex-direction: column;
  }

  header {
    margin-bottom: 14px;
  }
  header h1 {
    font-size: 25px;
    font-weight: 800;
    color: #1B2A4A;
    letter-spacing: -0.3px;
  }
  header p {
    margin-top: 5px;
    font-size: 12px;
    color: #7a8296;
    line-height: 1.5;
    max-width: 920px;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 34px;
    min-height: 0;
  }

  /* ---------- left panel : quadrant ---------- */
  #left-panel {
    width: 40%;
    display: flex;
    flex-direction: column;
  }

  #quad-title {
    font-size: 13px;
    font-weight: 700;
    color: #1B2A4A;
    margin-bottom: 8px;
  }

  #quad-wrap {
    flex: 1;
    display: grid;
    grid-template-columns: 28px 1fr;
    grid-template-rows: 1fr 22px;
    min-height: 0;
  }

  #y-axis-label {
    grid-column: 1;
    grid-row: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
  }
  .axis-label-v {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    font-size: 11px;
    font-weight: 700;
    color: #4a5468;
    line-height: 1.1;
  }

  #quad-box {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    border: 1px solid #d8dbe4;
    border-radius: 6px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .quad-cell {
    position: relative;
    padding: 12px 14px;
    color: #ffffff;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.35;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
  }
  .quad-navy { background: #1B2A4A; }
  .quad-terracotta { background: #B5673D; }

  #quad-box::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    border-top: 1px solid rgba(255,255,255,0.25);
    z-index: 2;
    pointer-events: none;
  }
  #quad-box::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    border-left: 1px solid rgba(255,255,255,0.25);
    z-index: 2;
    pointer-events: none;
  }

  #x-axis-row {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #4a5468;
  }
  #x-axis-row .axis-name {
    font-size: 11px;
    font-weight: 700;
    color: #1B2A4A;
  }

  /* marker + arrow */
  #marker-layer {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #marker-dot {
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #1B2A4A;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.35), 0 2px 6px rgba(0,0,0,0.35);
    transform: translate(-50%, -50%);
  }
  #marker-caption {
    position: absolute;
    transform: translate(-50%, 0);
    text-align: center;
    width: 220px;
  }
  #marker-caption .cap-date {
    font-size: 11.5px;
    font-weight: 800;
    color: #ffffff;
    background: rgba(0,0,0,0.32);
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 3px;
  }
  #marker-caption .cap-text {
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.55);
    line-height: 1.35;
  }

  /* ---------- right panel : gauges ---------- */
  #right-panel {
    width: 55%;
    display: flex;
    flex-direction: column;
  }
  #gauge-title {
    font-size: 13px;
    font-weight: 700;
    color: #1B2A4A;
    margin-bottom: 8px;
  }
  #gauge-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .gauge-row {
    display: grid;
    grid-template-columns: 108px 1fr;
    align-items: center;
    column-gap: 12px;
  }
  .gauge-label {
    font-size: 12px;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.3;
  }
  .gauge-asof {
    margin-top: 2px;
    font-size: 9px;
    font-weight: 600;
    color: #9aa1b3;
  }

  .gauge-track-wrap {
    position: relative;
    padding-top: 16px;
    padding-bottom: 15px;
  }
  .gauge-minmax {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    font-size: 9.5px;
    color: #9aa1b3;
    font-weight: 600;
  }
  .gauge-track {
    position: relative;
    height: 12px;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  .zone-safe { background: #2CB1BC; }
  .zone-warn { background: #F2994A; }
  .zone-danger { background: #A9673F; }

  .gauge-marker {
    position: absolute;
    top: -4px;
    width: 5px;
    height: 20px;
    background: #1B2A4A;
    border-radius: 2px;
    transform: translateX(-50%);
    box-shadow: 0 0 0 2px #ffffff;
  }
  .gauge-value {
    position: absolute;
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 800;
    color: #1B2A4A;
    white-space: nowrap;
  }
  .gauge-value.top { top: -17px; }
  .gauge-value.bottom { bottom: -16px; }

  /* ---------- footer (슬라이드 내부) ---------- */
  footer {
    margin-top: 14px;
  }

  #legend-row {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: #4a5468;
  }
  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }
  .legend-swatch.marker {
    width: 5px;
    height: 14px;
    border-radius: 2px;
    background: #1B2A4A;
  }

  #verdict-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FBF3EC;
    border: 1px solid #EED9C4;
    border-radius: 8px;
    padding: 8px 14px;
  }
  #verdict-tag {
    font-size: 11px;
    font-weight: 800;
    color: #B5673D;
    background: #ffffff;
    border: 1px solid #EED9C4;
    border-radius: 5px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  #verdict-text {
    font-size: 12px;
    font-weight: 700;
    color: #1B2A4A;
    line-height: 1.4;
  }

  #bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  #source-text {
    font-size: 9.5px;
    color: #a3a9b8;
    line-height: 1.4;
    max-width: 820px;
  }
  #org-text {
    font-size: 10.5px;
    color: #7a8296;
    font-weight: 700;
    margin-top: 4px;
  }
  #page-text {
    font-size: 10.5px;
    color: #a3a9b8;
    font-weight: 600;
  }

  #trends {
    width: 1280px;
    background: #ffffff;
    padding: 10px 44px 44px;
    border-top: 1px solid #eceef3;
  }
  .trend-section-title {
    font-size: 16px;
    font-weight: 800;
    color: #1B2A4A;
    margin: 26px 0 12px;
  }
  .trend-section-title:first-child {
    margin-top: 22px;
  }
  .trend-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 20px;
  }
  .trend-card {
    border: 1px solid #e6e8ef;
    border-radius: 8px;
    padding: 10px 14px 8px;
  }
  .trend-card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .trend-card-title {
    font-size: 12px;
    font-weight: 700;
    color: #1B2A4A;
  }
  .trend-svg {
    width: 100%;
    height: 90px;
    display: block;
  }
  .trend-range {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #9aa1b3;
    font-weight: 600;
    margin-top: 2px;
  }
  .trend-empty {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    line-height: 1.5;
    color: #b8bcc8;
    background: #fafbfc;
    border-radius: 4px;
  }
</style>
</head>

  }

  function formatYM(ym) {
    const [y, m] = ym.split('-');
    return `${y}.${Number(m)}`;
  }

  // 지표의 min~max 범위를 0~100 스케일로 두고, direction/zoneBoundaries에 따라
  // 안정(zone-safe)/경계(zone-warn)/위험(zone-danger) 3구간의 [from,to] 구간을 계산한다.
  // (게이지 바와 추이 그래프 배경 밴드가 동일한 로직을 공유한다)
  function computeZones(ind) {
    const range = ind.max - ind.min;
    const pct = v => ((v - ind.min) / range) * 100;
    const [b1, b2] = ind.zoneBoundaries;
    const p1 = pct(b1);
    const p2 = pct(b2);
    if (ind.direction === 'asc') {
      return [
        { cls: 'zone-danger', from: 0,  to: p1 },
        { cls: 'zone-warn',   from: p1, to: p2 },
        { cls: 'zone-safe',   from: p2, to: 100 }
      ];
    }
    return [
      { cls: 'zone-safe',   from: 0,  to: p1 },
      { cls: 'zone-warn',   from: p1, to: p2 },
      { cls: 'zone-danger', from: p2, to: 100 }
    ];
  }

  const ZONE_COLOR = { 'zone-safe': '#2CB1BC', 'zone-warn': '#F2994A', 'zone-danger': '#A9673F' };

  /* ---------- watermark tiling ---------- */
  (function buildWatermark() {
    const wm = document.getElementById('watermark');
    const text = cfg.meta.org + '  ·  ' + cfg.meta.asOf + '   ';
    const rows = 14;
    const itemsPerRow = 10;
    for (let r = 0; r < rows; r++) {
      const row = document.createElement('div');
      row.className = 'wm-row';
      row.style.top = (r * 90 - 200) + 'px';
      for (let i = 0; i < itemsPerRow; i++) {
        const span = document.createElement('span');
        span.className = 'wm-item';
        span.textContent = text;
        row.appendChild(span);
      }
      wm.appendChild(row);
    }
  })();

  /* ---------- quadrant marker + arrow ---------- */
  (function buildQuadrant() {
    const q = cfg.quadrant;
    const dot = document.getElementById('marker-dot');
    const cap = document.getElementById('marker-caption');
    const dateEl = document.getElementById('marker-date');
    const textEl = document.getElementById('marker-text');
    const line = document.getElementById('arrow-line');

    // x: 0~100 -> left 0%~100% ; y: 0~100 -> top 100%~0% (성장 위쪽이 y=100)
    const curLeft = q.current.x;
    const curTop = 100 - q.current.y;
    const toLeft = q.arrowTo.x;
    const toTop = 100 - q.arrowTo.y;

    dot.style.left = curLeft + '%';
    dot.style.top = curTop + '%';

    // caption placed below marker, clamped so it doesn't run off box
    cap.style.left = Math.min(85, Math.max(15, curLeft)) + '%';
    cap.style.top = 'calc(' + curTop + '% + 14px)';

    const dateMatch = q.caption.match(/현재\(([^)]+)\)/);
    dateEl.textContent = dateMatch ? '현재(' + dateMatch[1] + ')' : '현재';
    textEl.textContent = q.caption.replace(/^현재\([^)]+\)\s*/, '');

    line.setAttribute('x1', curLeft + '%');
    line.setAttribute('y1', curTop + '%');
    line.setAttribute('x2', toLeft + '%');
    line.setAttribute('y2', toTop + '%');
  })();

  /* ---------- gauges ---------- */
  (function buildGauges() {
    const list = document.getElementById('gauge-list');
    cfg.indicators.forEach(ind => {
      const zones = computeZones(ind).map(z => ({ cls: z.cls, width: z.to - z.from }));
      const range = ind.max - ind.min;
      const pct = v => ((v - ind.min) / range) * 100;
      const valuePct = Math.min(100, Math.max(0, pct(ind.value)));
      const valueSide = valuePct > 82 ? 'bottom' : 'top';

      const row = document.createElement('div');
      row.className = 'gauge-row';
      row.innerHTML = `
        <div class="gauge-label">${ind.label}<div class="gauge-asof">${formatAsOf(ind.asOf)}</div></div>
        <div class="gauge-track-wrap">
          <div class="gauge-minmax">
            <span>${ind.min}${ind.unit}</span>
            <span>${ind.max}${ind.unit}</span>
          </div>
          <div class="gauge-track">
            ${zones.map(z => `<div class="${z.cls}" style="width:${z.width}%;"></div>`).join('')}
          </div>
          <div class="gauge-marker" style="left:${valuePct}%;"></div>
          <div class="gauge-value ${valueSide}" style="left:${valuePct}%;">${ind.value}${ind.unit}</div>
        </div>
      `;
      list.appendChild(row);
    });
  })();

  /* ---------- 추이 그래프 (최근 N년) ---------- */
  function buildTrendSvg(ind, years) {
    const hist = ind.history || [];
    if (hist.length < 2) {
      return `<div class="trend-empty">history 데이터가 없습니다.<br>config에 채워 넣으면 최근 ${years}년 추이가 표시됩니다.</div>`;
    }

    const lastDate = new Date(hist[hist.length - 1].d + '-01T00:00:00');
    const cutoff = new Date(lastDate);
    cutoff.setFullYear(cutoff.getFullYear() - years);
    const points = hist.filter(p => new Date(p.d + '-01T00:00:00') >= cutoff);

    if (points.length < 2) {
      return `<div class="trend-empty">최근 ${years}년 구간에 데이터가 부족합니다 (2개 이상 필요).</div>`;
    }

    const W = 560, H = 90;
    const range = ind.max - ind.min;
    const valToY = v => {
      const clamped = Math.min(ind.max, Math.max(ind.min, v));
      return H - ((clamped - ind.min) / range) * H;
    };

    const bands = computeZones(ind).map(z => {
      const y = H - (z.to / 100) * H;
      const h = ((z.to - z.from) / 100) * H;
      return `<rect x="0" y="${y.toFixed(1)}" width="${W}" height="${h.toFixed(1)}" fill="${ZONE_COLOR[z.cls]}" opacity="0.13"></rect>`;
    }).join('');

    const stepX = W / (points.length - 1);
    const coords = points.map((p, i) => [i * stepX, valToY(p.v)]);
    const path = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
    const last = coords[coords.length - 1];

    const svg = `
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="trend-svg">
        ${bands}
        <path d="${path}" fill="none" stroke="#1B2A4A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path>
        <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="#1B2A4A"></circle>
      </svg>
      <div class="trend-range">
        <span>${formatYM(points[0].d)}</span>
        <span>${formatYM(points[points.length - 1].d)} · ${points[points.length - 1].v}${ind.unit}</span>
      </div>
    `;
    return svg;
  }

  (function buildTrends() {
    const grids = { 10: document.getElementById('trend-grid-10y'), 5: document.getElementById('trend-grid-5y') };
    [10, 5].forEach(years => {
      cfg.indicators.forEach(ind => {
        const card = document.createElement('div');
        card.className = 'trend-card';
        card.innerHTML = `
          <div class="trend-card-head">
            <span class="trend-card-title">${ind.label}</span>
          </div>
          ${buildTrendSvg(ind, years)}
        `;
        grids[years].appendChild(card);
      });
    });
  })();

})(config);
</script>

</body>
</html>
